<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Frame — UI design canvas</title>
  <style>:root { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; color: #d8dfdc; background: #171a1a; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
button, select { font: inherit; }
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px 26px; border-bottom: 1px solid #333737; background: #1b1e1e; }
.brand, .tools { display: flex; align-items: center; }
.brand { gap: 12px; white-space: nowrap; letter-spacing: .1em; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 5px; background: #e95843; color: #241918; font-size: 21px; font-weight: 700; }
.brand strong { display: block; font-size: 15px; }
.brand small { display: block; margin-top: 4px; color: #999b9a; font-size: 9px; letter-spacing: .16em; }
.tools { gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.design-choice, .design-size { color: #999b9a; font-size: 10px; white-space: nowrap; }
.design-choice { display: flex; align-items: center; gap: 8px; }
.design-size { min-width: 78px; text-align: center; }
select, .tools button { min-height: 34px; padding: 7px 10px; border: 1px solid #3a3d3d; border-radius: 5px; background: #242727; color: #d8d7d3; font-size: 11px; }
select { min-width: 142px; cursor: pointer; }
.tools button { cursor: pointer; }
.tools button:hover:not(:disabled), select:hover { background: #303333; border-color: #e95843; }
.tools button:disabled { opacity: .4; cursor: default; }
.brush-status { display: flex; align-items: center; gap: 8px; margin: 0 7px; color: #cc7666; font-size: 10px; white-space: nowrap; letter-spacing: .08em; }
.red-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3434; box-shadow: 0 0 0 3px #ff343425; }
.stage { position: relative; display: flex; align-items: center; justify-content: center; flex: 1; min-height: 400px; padding: 30px; background: radial-gradient(circle at 50% 40%, #242727, #171a1a 75%); overflow: hidden; }
.board { position: relative; flex: none; background: #1b1e1e; box-shadow: 0 0 0 1px #3a3d3d, 0 18px 70px #0009; overflow: hidden; }
.design, .brush { position: absolute; display: block; inset: 0; width: 100%; height: 100%; }
.design { pointer-events: none; user-select: none; }
.brush { z-index: 2; cursor: crosshair; touch-action: none; user-select: none; }
.brush path { fill: none; stroke: #ff3434; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
footer { min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 26px; border-top: 1px solid #333737; color: #999b9a; font-size: 10px; line-height: 1.4; }
#mark-count { color: #cc7666; white-space: nowrap; }
@media (max-width: 920px) { .topbar { align-items: flex-start; flex-direction: column; } .tools { justify-content: flex-start; } }
@media (max-width: 600px) { .topbar { padding: 13px; } .stage { min-height: 320px; padding: 15px; } footer { padding: 8px 13px; } }

.board { border-radius: 5px; }
button:focus-visible, select:focus-visible { outline: 2px solid #e95843; outline-offset: 3px; }

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">F</span><div><strong>FRAME</strong><small>UI DESIGN CANVAS</small></div></div>
      <div class="tools">
        <label class="design-choice">Design <select id="design-picker" aria-label="Design"></select></label>
        <span id="design-size" class="design-size"></span>
        <span class="brush-status"><span class="red-dot"></span> RED BRUSH</span>
        <button id="undo" type="button" disabled>Undo line</button>
        <button id="clear" type="button" disabled>Clear all lines</button>
        <button id="download" type="button" disabled>Download feedback</button>
      </div>
    </header>
    <div class="stage" id="stage">
      <div class="board" id="board" aria-label="Interface design">
        <canvas id="design" class="design" role="img" aria-label="Painted interface"></canvas>
      </div>
      <svg id="brush" class="brush" preserveAspectRatio="none" aria-label="Draw red feedback lines anywhere on the canvas"></svg>
    </div>
    <footer><span>Draw red lines anywhere. Hold Shift for a straight line. Marks save per design in this browser.</span><span id="mark-count">0 lines</span></footer>

<script>// Frame designs are registered by ordinary scripts; no build step is needed.
(() => {
  const designs = new Map();

  function register(design) {
    if (!design || !/^[a-z0-9-]+$/.test(design.id || "") ||
        !design.name || !Number.isInteger(design.width) || !Number.isInteger(design.height) ||
        design.width < 1 || design.height < 1 || typeof design.paint !== "function") {
      throw new Error("Frame.register expects an id, name, positive integer size, and paint function");
    }
    if (designs.has(design.id)) throw new Error(`Duplicate Frame design: ${design.id}`);
    designs.set(design.id, design);
  }

  window.Frame = {register, designs};
})();
</script>
<script>// Pump composition study; Frame's brush is the interaction surface.
(() => {
  const C={bg:'#1b1e1e',panel:'#202323',line:'#3a3d3d',muted:'#999b9a',text:'#d8d7d3',accent:'#e95843',low:'#8fc5aa',blue:'#809ec6'};
  function rect(c,x,y,w,h,r=2,fill=C.panel,stroke=C.line){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke();}}
  function text(c,t,x,y,size=10,color=C.text,weight=400){c.fillStyle=color;c.font=`${weight} ${size}px ui-monospace, SFMono-Regular, monospace`;c.textBaseline='middle';c.fillText(t,x,y);}
  function alignedText(c,t,x,y,size=9,color=C.text,align='center',weight=400){c.save();c.textAlign=align;text(c,t,x,y,size,color,weight);c.restore();}
  function button(c,t,x,y,w,active=false){rect(c,x,y,w,22,2,active?'#282725':C.panel);alignedText(c,t,x+w/2,y+11,9,active?C.accent:C.text);}
  function knob(c,label,value,x,y,a=0){alignedText(c,label,x,y-24,9,C.muted);c.strokeStyle=C.line;c.lineWidth=1;c.beginPath();c.arc(x,y,17,.75*Math.PI,2.25*Math.PI);c.stroke();if(a>0){c.strokeStyle=C.accent;c.lineWidth=2.2;c.beginPath();c.arc(x,y,17,.75*Math.PI,(.75+1.5*a)*Math.PI);c.stroke();}alignedText(c,value,x,y+23,9,C.muted);}
  function slider(c,label,value,x,y,w=282,a=0){text(c,label,x,y,9,C.muted);const tx=x+47,tw=w-84;rect(c,tx,y-1.5,tw,3,1,C.line,null);if(a>0)rect(c,tx,y-1.5,tw*a,3,1,C.accent,null);alignedText(c,value,x+w,y,9,C.text,'right');}
  function mixRow(c,label,x,y,value,color,tw=118){text(c,label,x,y,9,color,600);const bx=x+23,bw=tw+34;rect(c,bx,y-10,bw,20,0,'#282b2b',C.line);if(value>0){c.save();c.globalAlpha=90/255;rect(c,bx+1,y-9,(bw-2)*value,18,0,color,null);c.restore();}alignedText(c,Math.round(value*100)+'%',bx+bw/2,y,9,C.text);rect(c,x+tw+65,y-10,30,20,1,C.panel);alignedText(c,'SOLO',x+tw+80,y,7,C.muted);}
  const shapes=[["Sine", [[0.0, 1.0], [0.16, 0.82], [0.34, 0.36], [0.5, 0.0], [0.66, 0.36], [0.84, 0.82], [1.0, 1.0]], [-0.55, -0.1, 0.25, -0.25, 0.1, 0.55]], ["Soft", [[0.0, 1.0], [0.08, 0.12], [0.34, 0.58], [1.0, 1.0]], [-0.35, 0.42, -0.08]], ["Tight", [[0.0, 1.0], [0.035, 0.02], [0.15, 0.8], [1.0, 1.0]], [-0.58, 0.72, -0.04]], ["Long", [[0.0, 1.0], [0.05, 0.04], [0.46, 0.22], [1.0, 1.0]], [-0.48, 0.58, -0.02]], ["Snap", [[0.0, 1.0], [0.012, 0.22], [0.03, 0.0], [0.075, 0.94], [1.0, 1.0]], [-0.08, 0.02, 0.12, 0.0]], ["Punch", [[0.0, 1.0], [0.02, 0.06], [0.12, 0.44], [0.28, 0.18], [0.58, 0.9], [1.0, 1.0]], [-0.52, 0.3, -0.24, 0.22, -0.04]], ["Thump", [[0.0, 1.0], [0.03, 0.08], [0.18, 0.12], [0.42, 0.48], [0.72, 0.9], [1.0, 1.0]], [-0.35, 0.05, 0.12, 0.08, -0.02]], ["Double", [[0.0, 1.0], [0.04, 0.05], [0.18, 0.82], [0.34, 0.2], [0.56, 0.9], [1.0, 1.0]], [-0.48, 0.18, -0.28, 0.2, -0.05]]];
  function sample(shape,x){const n=shape[1],ts=shape[2];let i=0;while(i<n.length-2&&x>n[i+1][0])i++;const l=n[i],r=n[i+1];let t=Math.max(0,Math.min(1,(x-l[0])/(r[0]-l[0])));const tension=ts[i]||0,power=1+Math.abs(tension)*3;t=tension>=0?Math.pow(t,power):1-Math.pow(1-t,power);return l[1]+(r[1]-l[1])*t;}
  function curve(c,shape,x,y,w,h){c.beginPath();for(let i=0;i<=w;i++){const yy=y+(1-sample(shape,i/w))*h;i?c.lineTo(x+i,yy):c.moveTo(x,yy);}c.stroke();}
  function crossover(c,x,y,w,h){

    for(let band=0;band<2;band++){
      const points=[];for(let i=0;i<=w;i++){const f=20*Math.pow(1000,i/w),r=Math.tan(Math.PI*f/48000)/cutoff,p=Math.pow(r,4),gain=band?p/(1+p):1/(1+p);points.push([x+i,py+(1-gain)*ph]);}
      c.beginPath();c.moveTo(x,py+ph);for(const q of points)c.lineTo(...q);c.lineTo(x+w,py+ph);c.closePath();c.fillStyle=band?'rgba(128,158,198,.04)':'rgba(143,197,170,.04)';c.fill();
      c.beginPath();for(let i=0;i<points.length;i++)i?c.lineTo(...points[i]):c.moveTo(...points[i]);c.strokeStyle=band?'#6b819d':'#628976';c.lineWidth=1;c.stroke();
    }
    const marker=x+w/3;c.strokeStyle='#4a4f4e';c.beginPath();c.moveTo(marker,py);c.lineTo(marker,py+ph);c.stroke();text(c,'LP',x+7,y+25,7,C.low);text(c,'HP',x+w-18,y+25,7,C.blue);text(c,'200 Hz',marker+6,y+h-5,7,C.muted);
  }
  function shell(c,mode){
    c.fillStyle=C.bg;c.fillRect(0,0,640,400);rect(c,1,1,638,398,5,C.bg,C.line);
    text(c,'PORTALSURFER /',10,20,10,C.muted);text(c,'PUMP',125,20,10,C.accent);c.save();c.textAlign='right';text(c,'0.2.8+preview',629,6,6,'#585c5b');c.restore();
    button(c,'SYNC',269,12,47);button(c,'Sync 1/4 ▾',322,12,96);button(c,'‹',430,12,27);button(c,'›',461,12,27);button(c,'A',500,12,28,true);button(c,'→',532,12,27);button(c,'B',564,12,28);button(c,'?',603,12,26);
    const x=50,y=50,w=534,h=182;rect(c,10,48,575,186,0,C.bg,C.line);
    c.strokeStyle='#333737';c.lineWidth=1;for(let i=0;i<=4;i++){c.beginPath();c.moveTo(x+w*i/4,y);c.lineTo(x+w*i/4,y+h);c.stroke();}for(const level of [0,.5,.75,1]){c.beginPath();c.moveTo(x,y+h*level);c.lineTo(x+w,y+h*level);c.stroke();}
    const gradient=c.createLinearGradient(0,y,0,y+h);gradient.addColorStop(0,'rgba(233,88,67,.30)');gradient.addColorStop(1,'rgba(233,88,67,.03)');c.beginPath();c.moveTo(x,y+h);for(let i=0;i<=w;i++)c.lineTo(x+i,y+(1-sample(shapes[1],i/w))*h);c.lineTo(x+w,y+h);c.closePath();c.fillStyle=gradient;c.fill();
    crossover(c,x,y,w,h);c.strokeStyle=C.accent;c.lineWidth=1.6;curve(c,shapes[1],x,y,w,h);for(const n of shapes[1][1])rect(c,x+n[0]*w-2,y+(1-n[1])*h-2,4,4,0,C.bg,C.accent);
    for(const [label,level] of [['0 dB',0],['−6 dB',.5],['−12 dB',.75],['−∞',1]])text(c,label,24,y+level*h+3,7,C.muted);
    text(c,'OFFSET',18,240,7,C.muted);rect(c,50,237,534,7,0,C.panel);c.fillStyle=C.accent;c.fillRect(50,237,6,7);
    rect(c,594,48,36,196,0,C.bg,C.line);alignedText(c,'GR dB',612,54,7,C.muted);rect(c,603,63,18,169,0,'#282b2b',null);alignedText(c,'0.0',612,240,7,C.muted);
    shapes.forEach((s,i)=>{const sx=10+i*78;rect(c,sx,250,74,32,2,i===1?'#272523':C.panel,i===1?'#715048':C.line);c.strokeStyle=i===1?C.accent:C.muted;c.lineWidth=1;curve(c,s,sx+7,257,60,18);});
    c.strokeStyle='#2b2f2f';c.lineWidth=1;for(const yy of [288.5,322.5]){c.beginPath();c.moveTo(10,yy);c.lineTo(630,yy);c.stroke();}
    if(mode==='dual'){
      button(c,'24 dB/oct',15,294,90);
      slider(c,'SMOOTH','0%',184,298,270);slider(c,'SWING','0%',184,312,270);button(c,'SPECTRAL',544,294,80);

<script>// A neutral starting point for a new application interface.
(() => {
  function box(ctx, x, y, w, h, radius, fill, stroke) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, radius);
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }

  function text(ctx, value, x, y, size = 13, color = "#c9d3d1", weight = 400) {
    ctx.fillStyle = color;
    ctx.font = `${weight} ${size}px system-ui, sans-serif`;
    ctx.textBaseline = "middle";
    ctx.fillText(value, x, y);
  }

  Frame.register({
    id: "starter",
    name: "Starter UI",
    width: 960,
    height: 600,
    paint(ctx) {
      ctx.fillStyle = "#171c1d";
      ctx.fillRect(0, 0, 960, 600);
      box(ctx, 18, 18, 924, 564, 16, "#22292a", "#364142");
      box(ctx, 19, 19, 184, 562, [15, 0, 0, 15], "#1d2425");
      ctx.fillStyle = "#364142";
      ctx.fillRect(203, 19, 1, 562);
      text(ctx, "FRAME", 44, 54, 19, "#f2eee5", 700);
      text(ctx, "DESIGN STUDY", 44, 80, 10, "#829391", 600);
      box(ctx, 32, 122, 158, 38, 8, "#34403e");
      text(ctx, "Overview", 48, 141, 13, "#e2eae5", 600);
      for (const [label, y] of [["Components", 190], ["Typography", 230], ["Colors", 270]]) {
        text(ctx, label, 48, y, 13, "#9caaa7");
      }
      text(ctx, "Workspace", 238, 60, 25, "#edf1ed", 650);
      text(ctx, "A code-painted interface ready for a new project.", 238, 90, 12, "#9aa9a6");
      box(ctx, 238, 122, 670, 196, 12, "#293334", "#465352");
      text(ctx, "Main view", 262, 150, 14, "#e2e9e4", 600);
      ctx.strokeStyle = "#53605e";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(262, 176); ctx.lineTo(884, 176); ctx.stroke();
      ctx.strokeStyle = "#77b9aa";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      for (let x = 262; x <= 884; x += 6) {
        const y = 250 - Math.sin((x - 262) / 42) * 18 - Math.sin((x - 262) / 13) * 6;
        if (x === 262) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      box(ctx, 238, 338, 322, 156, 12, "#293334", "#465352");
      box(ctx, 578, 338, 330, 156, 12, "#293334", "#465352");
      text(ctx, "Details", 262, 366, 14, "#e2e9e4", 600);
      text(ctx, "Actions", 602, 366, 14, "#e2e9e4", 600);
      text(ctx, "Use shapes, lines, and type to paint a UI.", 262, 406, 12, "#9caaa7");
      box(ctx, 602, 394, 124, 38, 8, "#78b7a8");
      text(ctx, "Primary", 627, 413, 12, "#14211f", 650);
      box(ctx, 738, 394, 124, 38, 8, "#364443", "#647371");
      text(ctx, "Secondary", 756, 413, 12, "#dce7e1", 600);
      text(ctx, "Edit examples/starter.js to change this design.", 238, 535, 11, "#8fa19d");
    }
  });
})();
</script>

<script>// Example design painted from code. The reference image is never displayed on the canvas.
(() => {
let paint;
const mono = '"SFMono-Regular", Consolas, "Liberation Mono", monospace';

function roundedBox(x, y, width, height, radius, fill, stroke) {
  paint.beginPath();
  paint.roundRect(x, y, width, height, radius);
  if (fill) { paint.fillStyle = fill; paint.fill(); }
  if (stroke) { paint.strokeStyle = stroke; paint.lineWidth = 1; paint.stroke(); }
}

function label(value, x, y, size = 11, color = "#a2aaa6", align = "left") {
  paint.font = `${size}px ${mono}`;
  paint.textAlign = align;
  paint.textBaseline = "middle";
  paint.fillStyle = color;
  paint.fillText(value, x, y);
}

function line(x1, y1, x2, y2, color, width = 1) {
  paint.beginPath();
  paint.moveTo(x1, y1);
  paint.lineTo(x2, y2);
  paint.strokeStyle = color;
  paint.lineWidth = width;
  paint.stroke();
}

function fillButtonWithShadow(shape, color) {
  paint.save();
  paint.fillStyle = color;
  paint.shadowColor = "rgba(0, 0, 0, .24)";
  paint.shadowBlur = 4;
  paint.shadowOffsetY = 2;
  paint.fill(shape);
  paint.restore();
}

const traces = Object.fromEntries(Object.entries(SIFT_WAVE_TRACES).map(([name, bands]) => [
  name,
  Object.fromEntries(Object.entries(bands).map(([key, encoded]) => [key, Uint8Array.from(atob(encoded), character => character.charCodeAt(0))]))
]));
const audioSelection = {start: 220, end: 950, viewStart: 165, viewEnd: 1010, duration: "1.52 s"};
const selectionColors = {
  body: "rgba(113, 65, 77, .16)",
  bar: "rgba(198, 126, 112, .74)",
  edge: "rgba(204, 135, 119, .58)"
};

function paintWave(center, channel, overview = false) {
  const left = 18;
  const right = 1122;
  const bands = channel === 0 ? traces.upper : traces.lower;
  const scale = overview ? .22 : 1;
  line(left, center, right, center, overview ? "rgba(133, 102, 153, .28)" : "rgba(140, 102, 153, .36)");
  for (const inner of [false, true]) {
    const top = bands[inner ? "innerTop" : "outerTop"];
    const bottom = bands[inner ? "innerBottom" : "outerBottom"];
    const waveform = new Path2D();
    waveform.moveTo(left, center - top[left / 2] * scale);
    for (let x = left + 2; x <= right; x += 2) {
      waveform.lineTo(x, center - top[x / 2] * scale);
    }
    for (let x = right; x >= left; x -= 2) {
      waveform.lineTo(x, center + bottom[x / 2] * scale);
    }
    waveform.closePath();
    paint.fillStyle = inner ? "#e6715d" : "#735cac";
    paint.globalAlpha = .94;
    paint.fill(waveform);
  }
  paint.globalAlpha = 1;
}

function paintInset(path, edge, y0, y1, upper) {
  const metal = paint.createLinearGradient(0, y0, 0, y1);
  if (upper) {
    metal.addColorStop(0, "#343a37");
    metal.addColorStop(.6, "#383f3b");
    metal.addColorStop(1, "#3b423e");
  } else {
    metal.addColorStop(0, "#3b423e");
    metal.addColorStop(.4, "#383f3b");
    metal.addColorStop(1, "#343a37");
  }
  paint.fillStyle = metal;
  paint.fill(path);

  // Let the inner lip recede into the metal while the outer edge catches light.
  paint.save();
  paint.clip(path);
  paint.strokeStyle = "rgba(6, 10, 9, .14)";
  paint.lineWidth = 5;
  paint.shadowColor = "rgba(0, 0, 0, .13)";
  paint.shadowBlur = 5;
  paint.stroke(edge);
  paint.strokeStyle = "rgba(8, 13, 11, .08)";
  paint.lineWidth = 7;
  paint.shadowColor = "rgba(0, 0, 0, .09)";
  paint.shadowBlur = 5;
  paint.stroke(edge);
  paint.restore();
  paint.save();
  paint.strokeStyle = "rgba(173, 188, 179, .22)";
  paint.lineWidth = .8;
  paint.shadowColor = "rgba(184, 197, 189, .15)";
  paint.shadowBlur = 3;
  paint.stroke(edge);
  paint.restore();

  const cornerGlints = upper
    ? [
        {edge: "M162 14 L168 17 Q173 20 179 20 H186", x0: 162, x1: 186},
        {edge: "M814 20 H821 Q827 20 831 18 L838 14", x0: 814, x1: 838}
      ]
    : [
        {edge: "M148 486 L153 482 Q158 480 164 480 H171", x0: 148, x1: 171},
        {edge: "M749 480 H756 Q762 480 768 482 L773 486", x0: 749, x1: 773}
      ];
  for (const corner of cornerGlints) {
    const edgeLight = paint.createLinearGradient(corner.x0, 0, corner.x1, 0);
    edgeLight.addColorStop(0, "rgba(201, 215, 205, 0)");
    edgeLight.addColorStop(.5, "rgba(201, 215, 205, .23)");
    edgeLight.addColorStop(1, "rgba(201, 215, 205, 0)");
    paint.strokeStyle = edgeLight;
    paint.lineWidth = 1.1;
    paint.stroke(new Path2D(corner.edge));
  }
}

function paintButton(x, y, width, height, caption, textSize = 11, cutCorner = false) {
  if (cutCorner) {
    const cut = 9;
    const button = new Path2D();
    button.moveTo(x + 4, y);
    button.lineTo(x + width - 4, y);
    button.quadraticCurveTo(x + width, y, x + width, y + 4);
    button.lineTo(x + width, y + height - cut);
    button.lineTo(x + width - cut, y + height);
    button.lineTo(x + 4, y + height);
    button.quadraticCurveTo(x, y + height, x, y + height - 4);
    button.lineTo(x, y + 4);
    button.quadraticCurveTo(x, y, x + 4, y);
    button.closePath();
    fillButtonWithShadow(button, "#272c2a");
    paint.strokeStyle = "#48534d";
    paint.lineWidth = 1;
    paint.stroke(button);
  } else {
    const button = new Path2D();
    button.roundRect(x, y, width, height, 4);
    fillButtonWithShadow(button, "#272c2a");
    paint.strokeStyle = "#363d39";
    paint.lineWidth = 1;
    paint.stroke(button);
  }
  if (caption) label(caption, x + width / 2, y + height / 2 + .5, textSize, "#a2aba5", "center");
}

function paintMainSelection() {
  const {start, end, duration} = audioSelection;
  const selectionBar = new Path2D();
  selectionBar.rect(start, 71, end - start, 15);
  selectionBar.moveTo(start, 71);
  selectionBar.lineTo(start + 24, 71);
  selectionBar.lineTo(start, 95);
  selectionBar.closePath();
  paint.fillStyle = selectionColors.bar;
  paint.fill(selectionBar);
  label(duration, start + 11, 79, 11, "#f0ddd4");
  line(start + .5, 95, start + .5, 376, selectionColors.edge, 1.4);

  const handleEnd = end - 1;
  const handleLeft = handleEnd - 53;
  const handle = new Path2D();
  handle.moveTo(handleLeft, 71);
  handle.lineTo(handleEnd, 71);
  handle.lineTo(handleEnd, 86);
  handle.lineTo(handleEnd - 38, 86);
  handle.closePath();
  paint.save();
  paint.fillStyle = "#3d4641";
  paint.shadowColor = "rgba(0, 0, 0, .2)";
  paint.shadowBlur = 5;
  paint.shadowOffsetX = -3;
  paint.fill(handle);
  paint.restore();
  paint.save();
  paint.clip(handle);
  paint.strokeStyle = "rgba(170, 187, 175, .42)";
  paint.lineWidth = 3;
  paint.stroke(handle);
  paint.restore();
  paint.strokeStyle = "#1d2621";
  paint.lineWidth = 1.5;
  paint.stroke(handle);
  const inset = new Path2D();
  inset.moveTo(handleEnd - 35, 76);
  inset.lineTo(handleEnd - 10, 76);
  inset.lineTo(handleEnd - 10, 81);
  inset.lineTo(handleEnd - 30, 81);
  inset.closePath();
  const insetShade = paint.createLinearGradient(0, 76, 0, 81);
  insetShade.addColorStop(0, "#272e2a");
  insetShade.addColorStop(1, "#2e3631");
  paint.fillStyle = insetShade;
  paint.fill(inset);
  paint.strokeStyle = "#151b18";
  paint.lineWidth = 1;
  paint.stroke(inset);
  line(end + .5, 71, end + .5, 376, selectionColors.edge, 1.4);

  const guide = paint.createLinearGradient(0, 112, 0, 338);
  guide.addColorStop(0, "rgba(205, 174, 162, 0)");
  guide.addColorStop(.35, "rgba(205, 174, 162, .26)");
  guide.addColorStop(.65, "rgba(205, 174, 162, .26)");
  guide.addColorStop(1, "rgba(205, 174, 162, 0)");
  for (let quarter = 1; quarter <= 3; quarter++) {
    const x = start + (end - start) * quarter / 4;
    line(x, 112, x, 338, guide);
  }
}

function paintNavigatorSelection() {
  const {start, end, viewStart, viewEnd} = audioSelection;
  paint.fillStyle = selectionColors.bar;
  paint.fillRect(start, 391, end - start, 7);
  line(start + .5, 391, start + .5, 408, selectionColors.edge, 1.2);
  line(end + .5, 391, end + .5, 408, selectionColors.edge, 1.2);

  const navigationMetal = paint.createLinearGradient(0, 418, 0, 426);
  navigationMetal.addColorStop(0, "rgba(118, 108, 145, .72)");
  navigationMetal.addColorStop(1, "rgba(88, 80, 116, .72)");
  paint.fillStyle = navigationMetal;
  paint.fillRect(viewStart, 418, viewEnd - viewStart, 8);
  paint.fillStyle = "rgba(178, 168, 201, .58)";
  paint.fillRect(viewStart, 418, viewEnd - viewStart, 1.5);
  line(viewStart + .5, 413, viewStart + .5, 426, "rgba(183, 174, 205, .82)", 1.6);
  line(viewEnd + .5, 413, viewEnd + .5, 426, "rgba(183, 174, 205, .82)", 1.6);
}

function paintViewVignette(x, y, width, height, radius, opacity) {
  paint.save();
  paint.beginPath();
  paint.roundRect(x, y, width, height, 3);
  paint.clip();
  for (const cornerX of [x, x + width]) {
    for (const cornerY of [y, y + height]) {
      const shadow = paint.createRadialGradient(cornerX, cornerY, 0, cornerX, cornerY, radius);
      shadow.addColorStop(0, `rgba(0, 0, 0, ${opacity})`);
      shadow.addColorStop(.48, `rgba(0, 0, 0, ${opacity * .36})`);
      shadow.addColorStop(1, "rgba(0, 0, 0, 0)");
      paint.fillStyle = shadow;
      paint.fillRect(x, y, width, height);
    }
  }
  paint.restore();
}

function paintSift(context) {
  paint = context;
  paint.fillStyle = "#272a29";
  paint.fillRect(0, 0, 1140, 500);

  const upperEdge = new Path2D("M130 0 L168 17 Q173 20 179 20 H821 Q827 20 831 18 L869 0");
  const lowerEdge = new Path2D("M135 500 L153 482 Q158 480 164 480 H756 Q762 480 768 482 L786 500");
  paintInset(new Path2D("M130 0 L168 17 Q173 20 179 20 H821 Q827 20 831 18 L869 0 Z"), upperEdge, 0, 20, true);
  paintInset(new Path2D("M135 500 L153 482 Q158 480 164 480 H756 Q762 480 768 482 L786 500 Z"), lowerEdge, 480, 500, false);

  label("PORTALSURFER", 30, 51, 15, "#d5d5d0");

  label("⌄", 984, 42, 15, "#8b9490", "center");
  paintButton(1004, 27, 29, 30, "↗", 19, true);
  paintButton(1040, 27, 29, 30, "⚙", 15, true);
  paintButton(1076, 27, 27, 30, "?", 16, true);

  roundedBox(16.5, 70.5, 1107, 306, 3, "#202323", "#4b514e");
  paint.fillStyle = selectionColors.body;
  paint.fillRect(audioSelection.start, 71, audioSelection.end - audioSelection.start, 304);
  line(17, 223, 1123, 223, "rgba(130, 137, 132, .07)");
  line(17, 147, 1123, 147, "rgba(132, 139, 136, .12)");
  line(17, 300, 1123, 300, "rgba(132, 139, 136, .12)");

  paint.save();
  paint.beginPath();
  paint.rect(18, 84, 1104, 276);
  paint.clip();
  paintWave(147, 0);
  paintWave(300, 1);
  paint.restore();

  line(377, 71, 377, 376, "rgba(177, 185, 181, .62)", 1);
  for (const marker of [278, 295, 1068]) {
    paint.beginPath();
    paint.moveTo(marker - 3.5, 73);
    paint.lineTo(marker + 3.5, 73);
    paint.lineTo(marker, 78);
    paint.closePath();
    paint.fillStyle = "#bd886b";
    paint.fill();
    const stem = paint.createLinearGradient(0, 78, 0, 111);
    stem.addColorStop(0, "rgba(189, 136, 107, .28)");
    stem.addColorStop(.4, "rgba(189, 136, 107, .2)");
    stem.addColorStop(1, "rgba(189, 136, 107, 0)");
    line(marker, 78, marker, 111, stem);
  }
  label("0.00s", 27, 364, 10.5, "#9da5a1");
  label("2.38s", 1112, 364, 10.5, "#9da5a1", "right");
  paintMainSelection();
  paintViewVignette(17, 71, 1106, 305, 155, .13);

  roundedBox(16.5, 389.5, 1107, 37, 0, "#202323", "#484e4b");
  paint.fillStyle = selectionColors.body;
  paint.fillRect(audioSelection.start, 391, audioSelection.end - audioSelection.start, 34);
  line(17, 408, 1123, 408, "rgba(134, 142, 137, .17)");
  paint.save();
  paint.beginPath();
  paint.rect(18, 391, 1104, 34);
  paint.clip();
  paintWave(408, 0, true);
  paint.restore();
  paintNavigatorSelection();
  line(377, 390, 377, 426, "rgba(182, 192, 186, .73)");
  paintViewVignette(17, 390, 1106, 36, 91, .09);

  const arm = new Path2D("M32 446 H106 Q111 446 111 451 V472 L100 483 H32 Q27 483 27 478 V451 Q27 446 32 446 Z");
  fillButtonWithShadow(arm, "#313a38");
  paint.strokeStyle = "#7c8984";
  paint.lineWidth = 1;
  paint.stroke(arm);

  paint.arc(51, 464.5, 4.6, 0, Math.PI * 2);

  paintButton(842, 451, 31, 30, "", 11, true);

    line(x, 466 - height / 2, x, 466 + height / 2, "#aeb9b4", 2.8);

  paint.beginPath();
  paint.moveTo(892, 458); paint.lineTo(892, 474); paint.lineTo(904, 466); paint.closePath();

  function validLines(value) {
    if (!Array.isArray(value)) return [];
    return value.slice(0, 1000).filter(Array.isArray).map((line) =>
      line.slice(0, 5000).filter((point) => Array.isArray(point) && point.length === 2 && point.every(Number.isFinite))
    ).filter((line) => line.length > 0);
  }
  function load() {
    try {
      const saved = localStorage.getItem(storageKey()) ??
        (design.id === "sift" ? localStorage.getItem("sift-ui-feedback-v1") : null);
      return validLines(JSON.parse(saved || "[]"));
    } catch { return []; }
  }
  function updateControls() {
    undo.disabled = clear.disabled = download.disabled = lines.length === 0;
    count.textContent = `${lines.length} ${lines.length === 1 ? "line" : "lines"}`;
  }
  function save() {
    try { localStorage.setItem(storageKey(), JSON.stringify(lines)); }
    catch { /* The brush still works if storage is unavailable. */ }
    updateControls();
  }

  function geometry() {
    const boardBounds = board.getBoundingClientRect();
    const stageBounds = stage.getBoundingClientRect();
    return {
      boardBounds, stageBounds,
      scaleX: boardBounds.width / design.width,
      scaleY: boardBounds.height / design.height,
      offsetX: boardBounds.left - stageBounds.left,
      offsetY: boardBounds.top - stageBounds.top
    };
  }
  function pointFromEvent(event) {
    const {boardBounds, scaleX, scaleY} = geometry();
    return [(event.clientX - boardBounds.left) / scaleX, (event.clientY - boardBounds.top) / scaleY];
  }
  function pathData(points, view = geometry()) {
    return points.map(([x, y], index) =>
      `${index ? "L" : "M"}${(view.offsetX + x * view.scaleX).toFixed(1)} ${(view.offsetY + y * view.scaleY).toFixed(1)}`
    ).join(" ");
  }
  function makePath(points) {
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", pathData(points));
    brush.append(path);
    return path;
  }
  function redrawMarks() {
    const {stageBounds} = geometry();
    brush.setAttribute("viewBox", `0 0 ${stageBounds.width} ${stageBounds.height}`);
    brush.replaceChildren();
    lines.forEach((line) => {
      const path = makePath(line);
      if (line === active) activePath = path;
    });
    updateControls();
  }
  function fitBoard() {
    if (!design) return;
    const styles = getComputedStyle(stage);
    const usableWidth = stage.clientWidth - parseFloat(styles.paddingLeft) - parseFloat(styles.paddingRight);
    const usableHeight = stage.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom);
    const scale = Math.min(1, usableWidth / design.width, usableHeight / design.height);
    board.style.width = `${design.width * Math.max(scale, 0.01)}px`;
    board.style.height = `${design.height * Math.max(scale, 0.01)}px`;
    redrawMarks();
  }
  function paintDesign() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    designCanvas.width = Math.round(design.width * dpr);
    designCanvas.height = Math.round(design.height * dpr);
    const context = designCanvas.getContext("2d");
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    context.clearRect(0, 0, design.width, design.height);
    design.paint(context);
  }
  function selectDesign(id) {
    if (active) finishLine();
    design = Frame.designs.get(id);
    if (!design) return;
    picker.value = id;
    sizeLabel.textContent = `${design.width} × ${design.height}`;
    board.setAttribute("aria-label", `${design.name} interface design`);
    designCanvas.setAttribute("aria-label", `${design.name} painted interface`);
    lines = load();
    paintDesign();
    fitBoard();
    try { localStorage.setItem("frame-last-design", id); } catch { /* optional */ }
  }
  function finishLine() {
    if (!active) return;
    if (active.length === 1) active.push([active[0][0] + 0.1, active[0][1] + 0.1]);
    activePath.setAttribute("d", pathData(active));
    active = null;
    activePath = null;
    save();
  }

  brush.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    active = [pointFromEvent(event)];
    lines.push(active);
    activePath = makePath(active);
    brush.setPointerCapture(event.pointerId);
  });
  function updateActive(event) {
    if (!active) return;
    if (event.shiftKey) {
      active.splice(1, active.length - 1, pointFromEvent(event));
    } else {
      for (const sample of event.getCoalescedEvents?.() || [event]) {
        const next = pointFromEvent(sample);
        const last = active[active.length - 1];
        if (Math.hypot(next[0] - last[0], next[1] - last[1]) >= 1) active.push(next);
      }
    }
    activePath.setAttribute("d", pathData(active));
  }
  brush.addEventListener("pointermove", updateActive);
  brush.addEventListener("pointerup", (event) => { updateActive(event); finishLine(); });
  brush.addEventListener("pointercancel", finishLine);
  undo.addEventListener("click", () => { lines.pop(); redrawMarks(); save(); });
  clear.addEventListener("click", () => { lines = []; redrawMarks(); save(); });
  download.addEventListener("click", () => {
    const data = JSON.stringify({design: design.id, width: design.width, height: design.height, lines}, null, 2);
    const url = URL.createObjectURL(new Blob([data], {type: "application/json"}));
    const link = document.createElement("a");
    link.href = url;
    link.download = `${design.id}-feedback.json`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  picker.addEventListener("change", () => selectDesign(picker.value));
  document.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z" && lines.length) {
      event.preventDefault(); undo.click();
    }
  });

  for (const item of Frame.designs.values()) {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = item.name;
    picker.append(option);
  }
  if (!Frame.designs.size) throw new Error("Frame needs at least one registered design");
  let initial;
  try { initial = localStorage.getItem("frame-last-design"); } catch { /* optional */ }
  selectDesign(Frame.designs.has(initial) ? initial : Frame.designs.keys().next().value);
  new ResizeObserver(fitBoard).observe(stage);
  window.addEventListener("resize", fitBoard);
})();
</script>
</body>
</html>
